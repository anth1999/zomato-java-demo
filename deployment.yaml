


apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato-deployment
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: zomato-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8081
          imagePullPolicy: Always
